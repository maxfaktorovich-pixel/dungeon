<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подземелье Строителя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Верхняя полоска: переключатель режимов ===== -->
  <header id="topbar">
    <h1>🏰 Подземелье Строителя</h1>
    <div id="modes">
      <button data-mode="adventure" class="active">⚔️ Приключение</button>
      <button data-mode="builder">🧱 Строитель</button>
    </div>
  </header>

  <!-- Класс mode-adventure / mode-builder решает, какие панели видны -->
  <div id="app" class="mode-adventure">
    <!-- ===== Карта (есть в обоих режимах) ===== -->
    <section class="panel" id="map-panel">
      <h2>🗺️ Карта подземелья</h2>
      <div id="map-hint"></div>
      <div id="map-wrap">
        <div id="map"></div>
      </div>
      <!-- Компас: чтобы было понятно, куда ведёт "go north" -->
      <div id="compass" aria-label="Компас">
        <span class="c-n">N<small>север</small></span>
        <span class="c-w">W<small>запад</small></span>
        <span class="c-center">✦</span>
        <span class="c-e">E<small>восток</small></span>
        <span class="c-s">S<small>юг</small></span>
      </div>
    </section>

    <!-- ===== ПРИКЛЮЧЕНИЕ: текстовое окно ===== -->
    <section class="panel adventure-only" id="text-panel">
      <div id="log"></div>
      <div id="actions"></div>
      <form id="command-form" autocomplete="off">
        <span class="prompt">&gt;</span>
        <input id="command-input" placeholder="Введи команду, например: look" autofocus>
      </form>
    </section>

    <!-- ===== ПРИКЛЮЧЕНИЕ: герой ===== -->
    <section class="panel adventure-only" id="stats-panel">
      <div id="stats"></div>
    </section>

    <!-- ===== СТРОИТЕЛЬ: редактор комнаты ===== -->
    <section class="panel builder-only" id="editor-panel">
      <div id="editor"></div>
    </section>
  </div>

  <!-- Порядок важен: сначала данные, потом то, что их использует -->
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
